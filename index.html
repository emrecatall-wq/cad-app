<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1e293b">
<title>CAD Not Defteri</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --accent:#3b82f6; --accent2:#2563eb;
    --text:#e2e8f0; --muted:#94a3b8; --danger:#ef4444; --ok:#22c55e; --border:#334155;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; user-select:none;}
  #app{display:flex; flex-direction:column; width:100vw; height:100vh; height:100dvh;}

  /* ---------- LOCK SCREEN ---------- */
  #lockScreen{position:fixed; inset:0; background:linear-gradient(160deg,#0f172a,#1e293b 60%,#111827); z-index:9999;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;}
  #lockScreen h1{font-size:22px; font-weight:600; margin:0 0 4px; letter-spacing:.5px;}
  #lockScreen .sub{color:var(--muted); font-size:13px; margin-bottom:10px;}
  #lockBox{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:28px 26px; width:min(320px,86vw); text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.4);}
  #pwInput{width:100%; font-size:26px; letter-spacing:8px; text-align:center; padding:12px 8px; border-radius:10px; border:1px solid var(--border); background:#0b1220; color:var(--text); outline:none;}
  #pwInput:focus{border-color:var(--accent);}
  #lockBtn{margin-top:14px; width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer;}
  #lockBtn:active{background:var(--accent2);}
  #lockError{color:var(--danger); font-size:13px; height:16px; margin-top:8px;}

  /* ---------- TOP BAR ---------- */
  #topbar{display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:nowrap; overflow-x:auto;}
  #topbar::-webkit-scrollbar{height:4px;}
  .navbtn{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:14px; white-space:nowrap; cursor:pointer;}
  .navbtn:active{background:var(--accent2);}
  #dateLabel{font-weight:600; font-size:14px; padding:0 4px; white-space:nowrap;}
  #dateInput{background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px; font-size:13px;}
  #syncDot{width:9px; height:9px; border-radius:50%; background:var(--muted); margin-left:4px; flex:0 0 auto;}
  #syncDot.on{background:var(--ok);}
  #syncDot.busy{background:#f59e0b;}

  /* ---------- TOOLBAR ---------- */
  #toolbar{display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--panel2); border-bottom:1px solid var(--border); overflow-x:auto; white-space:nowrap;}
  #toolbar::-webkit-scrollbar{height:4px;}
  .tool{background:#1c2740; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 9px; font-size:16px; cursor:pointer; flex:0 0 auto; line-height:1;}
  .tool.active{background:var(--accent); border-color:var(--accent);}
  .tool.toggle.on{background:#0e7490; border-color:#0e7490;}
  .sep{width:1px; align-self:stretch; background:var(--border); margin:0 3px; flex:0 0 auto;}
  select.tool, input[type=color].tool{padding:5px; height:36px;}
  #finishPolyBtn{display:none;}

  /* ---------- WORKSPACE ---------- */
  #workspace{flex:1; overflow-y:auto; overflow-x:hidden; background:#0b1220; padding:16px 0 90px; display:flex; flex-direction:column; align-items:center; gap:22px;}
  .pageWrap{position:relative; width:min(96vw,760px); aspect-ratio:210/297; background:#fff; box-shadow:0 4px 24px rgba(0,0,0,.5); border-radius:4px; overflow:hidden; flex:0 0 auto;}
  .pageWrap .pageLabel{position:absolute; top:6px; left:8px; font-size:11px; color:#94a3b8; z-index:5; background:rgba(255,255,255,.7); padding:1px 6px; border-radius:4px;}
  .pageWrap .delPageBtn{position:absolute; top:4px; right:8px; z-index:6; background:rgba(239,68,68,.85); color:#fff; border:none; border-radius:6px; width:24px; height:24px; font-size:14px; cursor:pointer;}
  canvas.gridLayer, canvas.inkCanvas{position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none;}
  canvas.gridLayer{z-index:1;}
  canvas.inkCanvas{z-index:2;}
  .overlay{position:absolute; top:0; left:0; width:100%; height:100%; z-index:3; pointer-events:none;}
  .box{position:absolute; pointer-events:auto; border:1.5px dashed rgba(0,0,0,.35); border-radius:6px; min-width:60px; min-height:40px; overflow:hidden; touch-action:none;}
  .box.locked{border-style:solid; border-color:rgba(0,0,0,.15);}
  .box .boxBar{position:absolute; top:0; left:0; right:0; height:22px; background:rgba(30,41,59,.75); display:flex; align-items:center; justify-content:flex-end; gap:3px; padding:0 3px; cursor:grab; z-index:2;}
  .box .boxBar button{background:rgba(255,255,255,.15); border:none; color:#fff; width:18px; height:18px; border-radius:4px; font-size:11px; cursor:pointer; line-height:1;}
  .box .boxBar button.ok{background:#16a34a;}
  .box .boxBar button.del{background:#dc2626;}
  .box textarea{width:100%; height:100%; border:none; resize:none; padding:24px 8px 8px; font-size:14px; font-family:inherit; outline:none; background:transparent; color:#111;}
  .box img{width:100%; height:100%; object-fit:contain; display:block; padding-top:22px; box-sizing:border-box; pointer-events:none;}
  .box .resizeHandle{position:absolute; right:2px; bottom:2px; width:18px; height:18px; background:rgba(0,0,0,.35); border-radius:4px 0 6px 0; cursor:se-resize; z-index:2;}
  .box.note{background:#fff59d;}

  /* theme backgrounds applied to pageWrap */
  .theme-default{background:#ffffff;}
  .theme-sepya{background:#f4ecd8;}
  .theme-krem{background:#fdf6e3;}
  .theme-gri{background:#f1f3f5;}
  .theme-mavi{background:#eaf3fb;}
  .theme-yesil{background:#eef8ee;}

  #addPageBar{display:flex; justify-content:center; padding:6px;}
  #addPageBtn{background:var(--panel2); border:1px dashed var(--border); color:var(--text); padding:12px 24px; border-radius:10px; cursor:pointer; font-size:14px;}

  #fileInputPhoto{display:none;}
  #snapDot{position:absolute; width:12px; height:12px; border:2px solid #f59e0b; border-radius:50%; pointer-events:none; z-index:10; display:none; transform:translate(-50%,-50%);}
  .trackGuide{position:absolute; z-index:9; pointer-events:none; background:transparent; border-left:1px dashed #f59e0b; border-top:1px dashed #f59e0b; display:none;}

  #toast{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#111827; border:1px solid var(--border); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px; z-index:9998; opacity:0; transition:opacity .25s; pointer-events:none;}
  #toast.show{opacity:1;}

  ::selection{background:var(--accent);}
</style>
</head>
<body>
<div id="app">

  <!-- LOCK SCREEN -->
  <div id="lockScreen">
    <h1>CAD Not Defteri</h1>
    <div class="sub">Devam etmek için şifreyi girin</div>
    <div id="lockBox">
      <input id="pwInput" type="password" inputmode="numeric" maxlength="12" placeholder="••••••" autocomplete="off">
      <button id="lockBtn">Giriş Yap</button>
      <div id="lockError"></div>
    </div>
  </div>

  <!-- TOP BAR -->
  <div id="topbar">
    <button class="navbtn" id="prevDayBtn">◀ Önceki</button>
    <button class="navbtn" id="todayBtn">Bugün</button>
    <button class="navbtn" id="nextDayBtn">Sonraki ▶</button>
    <span id="dateLabel">-</span>
    <input type="date" id="dateInput">
    <span id="syncDot" title="Senkron durumu"></span>
  </div>

  <!-- TOOLBAR -->
  <div id="toolbar">
    <button class="tool" data-tool="pen" title="Serbest Kalem">✏️</button>
    <input type="color" id="penColor" class="tool" value="#1d4ed8" title="Kalem Rengi">
    <button class="tool" data-tool="eraser" title="Noktasal Silgi">🧽</button>
    <div class="sep"></div>
    <button class="tool" data-tool="line" title="Çizgi">📏</button>
    <button class="tool" data-tool="mdf" title="18mm MDF Çizgi">🟫</button>
    <button class="tool" data-tool="dim" title="Ölçülendirme">📐</button>
    <button class="tool" data-tool="polyline" title="Çoklu Çizgi">🖇️</button>
    <button class="tool" data-tool="rect" title="Dikdörtgen">▭</button>
    <button class="tool" id="finishPolyBtn" title="Çizgiyi Bitir">✔ Bitir</button>
    <div class="sep"></div>
    <button class="tool" data-tool="select" title="Seç / Taşı">🖱️</button>
    <button class="tool" id="deleteSelBtn" title="Sil">🗑️</button>
    <button class="tool" id="copySelBtn" title="Kopyala">📋</button>
    <button class="tool" id="pasteSelBtn" title="Yapıştır">📌</button>
    <div class="sep"></div>
    <button class="tool toggle" id="orthoBtn" title="Ortho (Yatay/Dikey Kilit)">⊥</button>
    <button class="tool toggle on" id="snapBtn" title="Snap (Endpoint/Midpoint)">🧲</button>
    <div class="sep"></div>
    <button class="tool" id="addPhotoBtn" title="Fotoğraf Ekle">🖼️</button>
    <button class="tool" id="addNoteBtn" title="Not Ekle">🗒️</button>
    <div class="sep"></div>
    <select id="themeSelect" class="tool" title="Sayfa Teması">
      <option value="theme-default">Varsayılan</option>
      <option value="theme-sepya">Sepya</option>
      <option value="theme-krem">Krem</option>
      <option value="theme-gri">Açık Gri</option>
      <option value="theme-mavi">Açık Mavi</option>
      <option value="theme-yesil">Açık Yeşil</option>
    </select>
    <select id="gridSelect" class="tool" title="Izgara Boyutu">
      <option value="0">Izgara Yok</option>
      <option value="10">Küçük (10px)</option>
      <option value="20" selected>Orta (20px)</option>
      <option value="40">Büyük (40px)</option>
    </select>
    <div class="sep"></div>
    <button class="tool" id="exportExcelBtn" title="Excel'e Aktar">📊 Excel</button>
    <button class="tool" id="exportPdfBtn" title="PDF'e Aktar">📄 PDF</button>
  </div>

  <!-- WORKSPACE -->
  <div id="workspace"></div>
  <div id="addPageBar"><button id="addPageBtn">＋ Yeni Sayfa Ekle</button></div>
</div>

<input type="file" id="fileInputPhoto" accept="image/*" multiple>
<div id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   AYARLAR
============================================================ */
const APP_PASSWORD = "156155";
const MM_PER_PX = 25.4 / 96;      // 96dpi ekran varsayımı
const PX_PER_MM = 96 / 25.4;      // ~3.7795
const CANVAS_W = 1240, CANVAS_H = 1754; // A4 @ ~150dpi dahili çözünürlük
const SNAP_TOL = 22;      // dahili px
const HIT_TOL  = 16;      // seçim tolerans dahili px

const firebaseConfig = {
  apiKey: "AIzaSyD-cad-notlarim-api-key-12345",
  authDomain: "cad-notlarim.firebaseapp.com",
  databaseURL: "https://cad-notlarim-default-rtdb.firebaseio.com",
  projectId: "cad-notlarim",
  storageBucket: "cad-notlarim.appspot.com",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:cadnotlarimapp123"
};

let fbApp=null, fbDb=null, fbReady=false;
try{
  fbApp = firebase.initializeApp(firebaseConfig);
  fbDb = firebase.database();
  fbReady = true;
}catch(e){ console.warn("Firebase başlatılamadı:", e); fbReady=false; }

/* ============================================================
   YARDIMCI FONKSİYONLAR
============================================================ */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fromISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function fmtLabel(iso){
  const d = fromISO(iso);
  const days=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  const months=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  return d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear()+" "+days[d.getDay()];
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }
function distToSeg(px,py,x1,y1,x2,y2){
  const A=px-x1, B=py-y1, C=x2-x1, D=y2-y1;
  const dot=A*C+B*D, len=C*C+D*D;
  let t = len!==0 ? dot/len : -1;
  t = Math.max(0,Math.min(1,t));
  const xx=x1+t*C, yy=y1+t*D;
  return dist(px,py,xx,yy);
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.remove("show"),1800);
}
function debounce(fn,ms){ let h; return function(...a){ clearTimeout(h); h=setTimeout(()=>fn.apply(this,a),ms); }; }

/* ============================================================
   DURUM (STATE)
============================================================ */
let currentDate = toISO(new Date());
let dayData = { pages: [] };   // { pages: [ {id,theme,gridSize,strokes:[],boxes:[]} ] }
let activeTool = "pen";
let orthoOn = false;
let snapOn = true;
let penColor = "#1d4ed8";
let clipboardStroke = null;
let selection = null; // {pageId, index}
let suppressRemoteEcho = false;

function newPage(theme,grid){
  return { id: uid(), theme: theme||"theme-default", gridSize: (grid===undefined?20:grid), strokes: [], boxes: [] };
}
function blankDay(){ return { pages: [ newPage() ] }; }

/* ============================================================
   YEREL DEPOLAMA (localStorage yedek/önbellek)
============================================================ */
function localKey(iso){ return "cadnotdefteri_"+iso; }
function saveLocal(iso, data){
  try{ localStorage.setItem(localKey(iso), JSON.stringify(data)); }catch(e){ console.warn("local kayıt hatası",e); }
}
function loadLocal(iso){
  try{ const raw=localStorage.getItem(localKey(iso)); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}

/* ============================================================
   FIREBASE SENKRON
============================================================ */
const syncDot = document.getElementById("syncDot");
function setSyncState(state){
  syncDot.classList.remove("on","busy");
  if(state==="on") syncDot.classList.add("on");
  else if(state==="busy") syncDot.classList.add("busy");
}
let currentDayRef = null;
let currentListener = null;

function attachFirebaseListener(iso){
  if(!fbReady) return;
  if(currentDayRef && currentListener) currentDayRef.off("value", currentListener);
  currentDayRef = fbDb.ref("notlar/"+iso);
  setSyncState("busy");
  currentListener = currentDayRef.on("value", snap=>{
    const val = snap.val();
    if(iso !== currentDate) return; // kullanıcı başka güne geçtiyse yoksay
    if(val && val.json){
      try{
        const parsed = JSON.parse(val.json);
        suppressRemoteEcho = true;
        dayData = parsed;
        saveLocal(iso, dayData);
        renderAllPages();
        suppressRemoteEcho = false;
      }catch(e){ console.warn("Firebase veri ayrıştırma hatası",e); }
    }
    setSyncState("on");
  }, err=>{
    console.warn("Firebase okuma hatası",err);
    setSyncState("off");
  });
}

const pushToFirebase = debounce(function(){
  if(!fbReady) return;
  if(suppressRemoteEcho) return;
  setSyncState("busy");
  fbDb.ref("notlar/"+currentDate).set({ json: JSON.stringify(dayData), updatedAt: Date.now() })
    .then(()=>setSyncState("on"))
    .catch(err=>{ console.warn("Firebase yazma hatası",err); setSyncState("off"); });
}, 700);

function persist(){
  saveLocal(currentDate, dayData);
  pushToFirebase();
}

/* ============================================================
   GÜN YÜKLE / DEĞİŞTİR
============================================================ */
function loadDay(iso){
  currentDate = iso;
  document.getElementById("dateLabel").textContent = fmtLabel(iso);
  document.getElementById("dateInput").value = iso;
  const local = loadLocal(iso);
  dayData = local && local.pages && local.pages.length ? local : blankDay();
  renderAllPages();
  attachFirebaseListener(iso);
}

/* ============================================================
   SAYFA / CANVAS OLUŞTURMA (DOM)
============================================================ */
const workspace = document.getElementById("workspace");

function renderAllPages(){
  workspace.innerHTML = "";
  dayData.pages.forEach((page, idx)=> workspace.appendChild(buildPageDOM(page, idx)));
}

function buildPageDOM(page, idx){
  const wrap = document.createElement("div");
  wrap.className = "pageWrap "+page.theme;
  wrap.dataset.pageId = page.id;

  const label = document.createElement("div");
  label.className = "pageLabel";
  label.textContent = "Sayfa "+(idx+1);
  wrap.appendChild(label);

  if(dayData.pages.length>1){
    const del = document.createElement("button");
    del.className = "delPageBtn"; del.textContent="×"; del.title="Sayfayı Sil";
    del.onclick = ()=>{
      if(confirm("Bu sayfayı silmek istiyor musunuz?")){
        dayData.pages = dayData.pages.filter(p=>p.id!==page.id);
        renderAllPages(); persist();
      }
    };
    wrap.appendChild(del);
  }

  const gridCanvas = document.createElement("canvas");
  gridCanvas.className="gridLayer"; gridCanvas.width=CANVAS_W; gridCanvas.height=CANVAS_H;
  wrap.appendChild(gridCanvas);

  const ink = document.createElement("canvas");
  ink.className="inkCanvas"; ink.width=CANVAS_W; ink.height=CANVAS_H;
  wrap.appendChild(ink);

  const overlay = document.createElement("div");
  overlay.className="overlay";
  wrap.appendChild(overlay);

  drawGrid(gridCanvas, page.gridSize);
  drawStrokes(ink, page.strokes, selection && selection.pageId===page.id ? selection.index : -1);
  page.boxes.forEach(b=> overlay.appendChild(buildBoxDOM(page,b)));

  wirePagePointer(wrap, ink, page);
  return wrap;
}

function refreshPage(pageId){
  const wrap = workspace.querySelector('.pageWrap[data-page-id="'+pageId+'"]');
  if(!wrap) return;
  const page = dayData.pages.find(p=>p.id===pageId);
  if(!page) return;
  wrap.className = "pageWrap "+page.theme;
  const ink = wrap.querySelector(".inkCanvas");
  drawStrokes(ink, page.strokes, selection && selection.pageId===page.id ? selection.index : -1);
  const grid = wrap.querySelector(".gridLayer");
  drawGrid(grid, page.gridSize);
  const overlay = wrap.querySelector(".overlay");
  overlay.innerHTML="";
  page.boxes.forEach(b=> overlay.appendChild(buildBoxDOM(page,b)));
}

/* ============================================================
   IZGARA ÇİZİMİ
============================================================ */
function drawGrid(canvas, size){
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!size || size<=0) return;
  ctx.strokeStyle = "rgba(0,0,0,0.10)";
  ctx.lineWidth = 1;
  for(let x=0;x<=canvas.width;x+=size){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for(let y=0;y<=canvas.height;y+=size){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
}

/* ============================================================
   ÇİZİM (STROKES) ÇİZDİRME
============================================================ */
function strokeCandidatePoints(s){
  // snap için uç/orta noktalar
  const pts=[];
  if(s.type==="pen"){
    if(s.points.length){ pts.push(s.points[0]); pts.push(s.points[s.points.length-1]); }
  } else if(s.type==="line" || s.type==="mdf" || s.type==="dim"){
    pts.push({x:s.x1,y:s.y1},{x:s.x2,y:s.y2},{x:(s.x1+s.x2)/2,y:(s.y1+s.y2)/2});
  } else if(s.type==="rect"){
    pts.push({x:s.x1,y:s.y1},{x:s.x2,y:s.y1},{x:s.x1,y:s.y2},{x:s.x2,y:s.y2},
              {x:(s.x1+s.x2)/2,y:s.y1},{x:(s.x1+s.x2)/2,y:s.y2},{x:s.x1,y:(s.y1+s.y2)/2},{x:s.x2,y:(s.y1+s.y2)/2});
  } else if(s.type==="polyline"){
    s.points.forEach((p,i)=>{
      pts.push(p);
      if(i>0){ const q=s.points[i-1]; pts.push({x:(p.x+q.x)/2,y:(p.y+q.y)/2}); }
    });
  }
  return pts;
}

function allCandidatePoints(strokes, excludeIdx){
  let all=[];
  strokes.forEach((s,i)=>{ if(i!==excludeIdx) all = all.concat(strokeCandidatePoints(s)); });
  return all;
}

function drawArrowHead(ctx,x,y,angle,size){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angle);
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(-size, size*0.42);
  ctx.lineTo(-size, -size*0.42);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSingleStroke(ctx, s, highlighted){
  ctx.save();
  if(highlighted){ ctx.shadowColor="#f59e0b"; ctx.shadowBlur=10; }
  if(s.type==="pen"){
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width||3;
    ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath();
    s.points.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
  } else if(s.type==="line"){
    ctx.strokeStyle = highlighted?"#f59e0b":(s.color||"#111827"); ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    const mm = dist(s.x1,s.y1,s.x2,s.y2)/PX_PER_MM;
    const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2;
    ctx.font="20px sans-serif"; ctx.fillStyle="#111827";
    ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText(mm.toFixed(0)+" mm", mx, my-6);
  } else if(s.type==="mdf"){
    const thickness = 18*PX_PER_MM;
    const dx=s.x2-s.x1, dy=s.y2-s.y1; const len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    const hw=thickness/2;
    ctx.beginPath();
    ctx.moveTo(s.x1+nx*hw, s.y1+ny*hw);
    ctx.lineTo(s.x2+nx*hw, s.y2+ny*hw);
    ctx.lineTo(s.x2-nx*hw, s.y2-ny*hw);
    ctx.lineTo(s.x1-nx*hw, s.y1-ny*hw);
    ctx.closePath();
    ctx.fillStyle = highlighted? "rgba(245,158,11,0.55)" : "rgba(120,53,15,0.35)";
    ctx.strokeStyle = highlighted? "#f59e0b" : "#78350f";
    ctx.lineWidth = 2;
    ctx.fill(); ctx.stroke();
    const mm = dist(s.x1,s.y1,s.x2,s.y2)/PX_PER_MM;
    const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2;
    ctx.font="18px sans-serif"; ctx.fillStyle="#111827"; ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText("18mm MDF · "+mm.toFixed(0)+"mm", mx, my-hw-6);
  } else if(s.type==="dim"){
    const col = highlighted? "#f59e0b" : "#dc2626";
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
    const angle = Math.atan2(s.y2-s.y1, s.x2-s.x1);
    drawArrowHead(ctx, s.x1, s.y1, angle+Math.PI, 12);
    drawArrowHead(ctx, s.x2, s.y2, angle, 12);
    const mm = dist(s.x1,s.y1,s.x2,s.y2)/PX_PER_MM;
    const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2;
    ctx.save(); ctx.translate(mx,my); ctx.rotate(angle);
    ctx.font="19px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText(mm.toFixed(1)+" mm", 0, -6);
    ctx.restore();
  } else if(s.type==="polyline"){
    ctx.strokeStyle = highlighted?"#f59e0b":(s.color||"#111827"); ctx.lineWidth=2.4;
    ctx.lineJoin="round";
    ctx.beginPath();
    s.points.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    s.points.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); });
  } else if(s.type==="rect"){
    ctx.strokeStyle = highlighted?"#f59e0b":(s.color||"#111827"); ctx.lineWidth=2.4;
    ctx.strokeRect(Math.min(s.x1,s.x2), Math.min(s.y1,s.y2), Math.abs(s.x2-s.x1), Math.abs(s.y2-s.y1));
    const w = Math.abs(s.x2-s.x1)/PX_PER_MM, h=Math.abs(s.y2-s.y1)/PX_PER_MM;
    ctx.font="17px sans-serif"; ctx.fillStyle="#111827"; ctx.textAlign="left"; ctx.textBaseline="top";
    ctx.fillText(w.toFixed(0)+" x "+h.toFixed(0)+" mm", Math.min(s.x1,s.x2)+4, Math.min(s.y1,s.y2)+4);
  }
  ctx.restore();
}

function drawStrokes(canvas, strokes, highlightIdx){
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  strokes.forEach((s,i)=> drawSingleStroke(ctx, s, i===highlightIdx));
}

function buildBoxDOM(page, box){
  const el = document.createElement("div");
  el.className = "box "+(box.type==="note"?"note":"image")+(box.locked?" locked":"");
  el.style.left = box.x+"px"; el.style.top = box.y+"px";
  el.style.width = box.w+"px"; el.style.height = box.h+"px";
  if(box.type==="note" && box.color) el.style.background = box.color;

  const bar = document.createElement("div"); bar.className="boxBar";
  if(box.type==="note"){
    const okBtn = document.createElement("button"); okBtn.className="ok";
    okBtn.textContent = box.locked ? "✎" : "✓";
    okBtn.title = box.locked ? "Düzenle" : "Kilitle";
    okBtn.onclick = (ev)=>{ ev.stopPropagation(); box.locked = !box.locked; refreshPage(page.id); persist(); };
    bar.appendChild(okBtn);
    const colorBtn = document.createElement("input");
    colorBtn.type="color"; colorBtn.value = box.color||"#fff59d";
    colorBtn.style.width="20px"; colorBtn.style.height="18px"; colorBtn.style.border="none"; colorBtn.style.padding="0"; colorBtn.style.background="none";
    colorBtn.oninput = (ev)=>{ box.color=ev.target.value; el.style.background=box.color; persist(); };
    bar.appendChild(colorBtn);
  }
  const delBtn = document.createElement("button"); delBtn.className="del"; delBtn.textContent="×"; delBtn.title="Sil";
  delBtn.onclick=(ev)=>{ ev.stopPropagation(); page.boxes = page.boxes.filter(b=>b.id!==box.id); refreshPage(page.id); persist(); };
  bar.appendChild(delBtn);
  el.appendChild(bar);

  if(box.type==="note"){
    const ta = document.createElement("textarea");
    ta.value = box.text||"";
    ta.placeholder="Not yazın...";
    ta.readOnly = !!box.locked;
    ta.oninput = ()=>{ box.text = ta.value; persist(); };
    el.appendChild(ta);
  } else {
    const img = document.createElement("img");
    img.src = box.src;
    el.appendChild(img);
  }

  const handle = document.createElement("div"); handle.className="resizeHandle";
  el.appendChild(handle);

  wireBoxDrag(el, bar, handle, page, box);
  return el;
}

function wireBoxDrag(el, bar, handle, page, box){
  let dragging=false, resizing=false, startX=0, startY=0, ox=0, oy=0, ow=0, oh=0;
  const wrap = ()=> el.closest(".pageWrap");

  function pageScale(){
    const w = wrap();
    const rect = w.getBoundingClientRect();
    return { sx: CANVAS_W/rect.width, sy: CANVAS_H/rect.height };
  }

  bar.addEventListener("pointerdown", (e)=>{
    if(e.target.tagName==="BUTTON" || e.target.tagName==="INPUT") return;
    dragging=true; bar.setPointerCapture(e.pointerId);
    startX=e.clientX; startY=e.clientY; ox=box.x; oy=box.y;
  });
  bar.addEventListener("pointermove",(e)=>{
    if(!dragging) return;
    const sc = pageScale();
    box.x = Math.max(0, ox + (e.clientX-startX)*sc.sx);
    box.y = Math.max(0, oy + (e.clientY-startY)*sc.sy);
    el.style.left = box.x+"px"; el.style.top = box.y+"px";
  });
  bar.addEventListener("pointerup",(e)=>{ if(dragging){ dragging=false; persist(); } });
  bar.addEventListener("pointercancel",()=>{ dragging=false; });

  handle.addEventListener("pointerdown",(e)=>{
    e.stopPropagation();
    resizing=true; handle.setPointerCapture(e.pointerId);
    startX=e.clientX; startY=e.clientY; ow=box.w; oh=box.h;
  });
  handle.addEventListener("pointermove",(e)=>{
    if(!resizing) return;
    const sc = pageScale();
    box.w = Math.max(60, ow + (e.clientX-startX)*sc.sx);
    box.h = Math.max(40, oh + (e.clientY-startY)*sc.sy);
    el.style.width = box.w+"px"; el.style.height = box.h+"px";
  });
  handle.addEventListener("pointerup",()=>{ if(resizing){ resizing=false; persist(); } });
  handle.addEventListener("pointercancel",()=>{ resizing=false; });
}

/* ============================================================
   CANVAS ÇİZİM ETKİLEŞİMİ (POINTER EVENTS)
============================================================ */
let drawingState = null; // {type, pageId, ink, ...}
let polylinePoints = [];
let activePolyPage = null;

function toCanvasCoords(e, canvas){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  return { x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY };
}

function findSnapPoint(page, x, y, excludeLast){
  if(!snapOn) return null;
  const candidates = allCandidatePoints(page.strokes, -1);
  let best=null, bestD=SNAP_TOL;
  candidates.forEach(p=>{
    const d = dist(x,y,p.x,p.y);
    if(d<bestD){ bestD=d; best=p; }
  });
  return best;
}

function applyOrtho(x1,y1,x2,y2){
  const dx=Math.abs(x2-x1), dy=Math.abs(y2-y1);
  if(dx>dy) return {x:x2,y:y1}; else return {x:x1,y:y2};
}

function hitTestStroke(s, x, y){
  if(s.type==="pen"){
    for(let i=1;i<s.points.length;i++){
      if(distToSeg(x,y,s.points[i-1].x,s.points[i-1].y,s.points[i].x,s.points[i].y) < HIT_TOL) return true;
    }
    return false;
  }
  if(s.type==="line"||s.type==="mdf"||s.type==="dim"){
    return distToSeg(x,y,s.x1,s.y1,s.x2,s.y2) < HIT_TOL + (s.type==="mdf"?9*PX_PER_MM:0);
  }
  if(s.type==="rect"){
    const x1=Math.min(s.x1,s.x2), x2=Math.max(s.x1,s.x2), y1=Math.min(s.y1,s.y2), y2=Math.max(s.y1,s.y2);
    const edges=[[x1,y1,x2,y1],[x2,y1,x2,y2],[x2,y2,x1,y2],[x1,y2,x1,y1]];
    return edges.some(ed=>distToSeg(x,y,ed[0],ed[1],ed[2],ed[3])<HIT_TOL);
  }
  if(s.type==="polyline"){
    for(let i=1;i<s.points.length;i++){
      if(distToSeg(x,y,s.points[i-1].x,s.points[i-1].y,s.points[i].x,s.points[i].y) < HIT_TOL) return true;
    }
    return false;
  }
  return false;
}

function wirePagePointer(wrap, ink, page){
  let pendingPen = null;

  ink.addEventListener("pointerdown",(e)=>{
    ink.setPointerCapture(e.pointerId);
    let {x,y} = toCanvasCoords(e, ink);
    const snap = findSnapPoint(page,x,y);
    if(snap){ x=snap.x; y=snap.y; }

    if(activeTool==="pen"){
      pendingPen = { type:"pen", color:penColor, width:3, points:[{x,y}] };
    } else if(activeTool==="eraser"){
      eraseAt(page, x, y);
    } else if(activeTool==="line" || activeTool==="mdf" || activeTool==="dim" || activeTool==="rect"){
      drawingState = { type:activeTool, pageId:page.id, x1:x,y1:y,x2:x,y2:y };
    } else if(activeTool==="polyline"){
      if(activePolyPage !== page.id){ polylinePoints = []; activePolyPage = page.id; }
      polylinePoints.push({x,y});
      document.getElementById("finishPolyBtn").style.display = polylinePoints.length>=2 ? "inline-block":"none";
      redrawWithPreview(page, ink);
    } else if(activeTool==="select"){
      let found=-1;
      for(let i=page.strokes.length-1;i>=0;i--){ if(hitTestStroke(page.strokes[i],x,y)){ found=i; break; } }
      if(found>=0){
        selection = {pageId:page.id, index:found};
        selection.dragStart = {x,y};
        selection.strokeSnapshot = JSON.parse(JSON.stringify(page.strokes[found]));
      } else {
        selection = null;
      }
      drawStrokes(ink, page.strokes, selection && selection.pageId===page.id ? selection.index : -1);
    }
  });

  ink.addEventListener("pointermove",(e)=>{
    let {x,y} = toCanvasCoords(e, ink);
    const snap = findSnapPoint(page,x,y);
    const guideEl = null;
    if(snap){ x=snap.x; y=snap.y; }

    if(activeTool==="pen" && pendingPen){
      pendingPen.points.push({x,y});
      drawStrokes(ink, page.strokes);
      drawSingleStroke(ink.getContext("2d"), pendingPen, false);
    } else if(drawingState && drawingState.pageId===page.id){
      let x2=x, y2=y;
      if(orthoOn || drawingState.type==="mdf"){
        const o = applyOrtho(drawingState.x1, drawingState.y1, x2, y2);
        x2=o.x; y2=o.y;
      }
      drawingState.x2=x2; drawingState.y2=y2;
      drawStrokes(ink, page.strokes);
      drawSingleStroke(ink.getContext("2d"), drawingState, false);
    } else if(activeTool==="polyline" && activePolyPage===page.id && polylinePoints.length){
      let lx=x, ly=y;
      if(orthoOn && polylinePoints.length){
        const last = polylinePoints[polylinePoints.length-1];
        const o = applyOrtho(last.x,last.y,x,y); lx=o.x; ly=o.y;
      }
      redrawWithPreview(page, ink, {x:lx,y:ly});
    } else if(activeTool==="select" && selection && selection.pageId===page.id && selection.dragStart){
      const dx = x - selection.dragStart.x, dy = y - selection.dragStart.y;
      moveStroke(selection.strokeSnapshot, page.strokes[selection.index], dx, dy);
      drawStrokes(ink, page.strokes, selection.index);
    }
  });

  function finishPointer(e){
    if(activeTool==="pen" && pendingPen){
      if(pendingPen.points.length>1) page.strokes.push(pendingPen);
      pendingPen=null;
      drawStrokes(ink, page.strokes);
      persist();
    } else if(drawingState && drawingState.pageId===page.id){
      const s = drawingState; drawingState=null;
      if(dist(s.x1,s.y1,s.x2,s.y2) > 4){
        page.strokes.push({type:s.type, x1:s.x1,y1:s.y1,x2:s.x2,y2:s.y2, color: s.type==="line"?penColor:undefined});
      }
      drawStrokes(ink, page.strokes);
      persist();
    } else if(activeTool==="select" && selection && selection.pageId===page.id && selection.dragStart){
      selection.dragStart=null; selection.strokeSnapshot=null;
      persist();
    }
  }
  ink.addEventListener("pointerup", finishPointer);
  ink.addEventListener("pointercancel", finishPointer);
}

function moveStroke(orig, target, dx, dy){
  if(orig.type==="pen"){
    target.points = orig.points.map(p=>({x:p.x+dx,y:p.y+dy}));
  } else if(orig.type==="polyline"){
    target.points = orig.points.map(p=>({x:p.x+dx,y:p.y+dy}));
  } else if(orig.x1!==undefined){
    target.x1=orig.x1+dx; target.y1=orig.y1+dy; target.x2=orig.x2+dx; target.y2=orig.y2+dy;
  }
}

function redrawWithPreview(page, ink, previewPoint){
  drawStrokes(ink, page.strokes);
  if(polylinePoints.length){
    const pts = previewPoint ? polylinePoints.concat([previewPoint]) : polylinePoints;
    drawSingleStroke(ink.getContext("2d"), {type:"polyline", points:pts, color:penColor}, false);
  }
}

function eraseAt(page, x, y){
  const before = page.strokes.length;
  page.strokes = page.strokes.filter(s=> !hitTestStroke(s,x,y));
  if(page.strokes.length!==before){
    refreshPage(page.id);
    persist();
  }
}

function finishPolyline(){
  if(activePolyPage && polylinePoints.length>=2){
    const page = dayData.pages.find(p=>p.id===activePolyPage);
    if(page){
      page.strokes.push({type:"polyline", points:polylinePoints.slice(), color:penColor});
      refreshPage(page.id);
      persist();
    }
  }
  polylinePoints=[]; activePolyPage=null;
  document.getElementById("finishPolyBtn").style.display="none";
}

document.getElementById("exportExcelBtn").addEventListener("click", async ()=>{

function collectAllLocalDates(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("cadnotdefteri_")===0) out.push(k.replace("cadnotdefteri_",""));
  }
  out.sort();
  return out;
}

    pdf.text(currentDate+" - Sayfa "+(i+1), 5, 292);
  }
  pdf.save("cad_not_"+currentDate+".pdf");
});

/* ============================================================
   ŞİFRE KİLİDİ
============================================================ */
function tryUnlock(){
  const val = document.getElementById("pwInput").value;
  if(val === APP_PASSWORD){
    document.getElementById("lockScreen").style.display="none";
    boot();
  } else {
    document.getElementById("lockError").textContent = "Şifre hatalı, tekrar deneyin.";
    document.getElementById("pwInput").value="";
    document.getElementById("pwInput").focus();
  }
}
document.getElementById("lockBtn").addEventListener("click", tryUnlock);
document.getElementById("pwInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") tryUnlock(); });

/* ============================================================
   BAŞLANGIÇ
============================================================ */
let booted = false;
function boot(){
  if(booted) return; booted = true;
  loadDay(toISO(new Date()));
}

/* PWA: basit servis worker (sayfa önbellekleme) */
if("serviceWorker" in navigator){
  try{
    const swCode = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{});";
    const blob = new Blob([swCode], {type:"text/javascript"});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}
